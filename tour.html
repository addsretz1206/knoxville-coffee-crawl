<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knoxville Coffee Crawl (Text Version)</title>
  <meta name="description" content="Text-only, screen-reader-friendly version of the Knoxville Coffee Crawl StoryMap.">
  <link rel="icon" href="images/coffee-pin.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="tour">
  <a class="skip" href="#tour">Skip to the tour</a>
  <main>
    <p><a href="index.html">&larr; Back to the interactive map</a></p>
    <div id="tour" aria-live="polite">Loading the tour&hellip;</div>
    <noscript><p>This page builds its content from <a href="storymap.json">storymap.json</a> and needs JavaScript.</p></noscript>
  </main>
  <script>
    // Builds the page from storymap.json so it always matches the map.
    fetch('storymap.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var out = document.getElementById('tour');
        out.removeAttribute('aria-live');
        out.innerHTML = '';
        data.storymap.slides.forEach(function (s, i) {
          var sec = document.createElement('section');
          var h = document.createElement(i === 0 ? 'h1' : 'h2');
          h.innerHTML = s.text.headline;
          sec.appendChild(h);
          var body = document.createElement('div');
          body.innerHTML = s.text.text;
          // The map's own link to this page isn't needed here.
          body.querySelectorAll('a[href="tour.html"]').forEach(function (a) { a.parentNode.removeChild(a); });
          sec.appendChild(body);
          var m = s.media || {};
          if (m.url) {
            var fig = document.createElement('figure');
            var img = document.createElement('img');
            img.src = m.url;
            img.alt = m.alt || '';
            fig.appendChild(img);
            if (m.caption || m.credit) {
              var cap = document.createElement('figcaption');
              cap.innerHTML = (m.caption || '') + (m.credit ? ' <span>(' + m.credit + ')</span>' : '');
              fig.appendChild(cap);
            }
            sec.appendChild(fig);
          }
          out.appendChild(sec);
        });
      })
      .catch(function () {
        document.getElementById('tour').textContent = 'Could not load the tour data.';
      });
  </script>
</body>
</html>
